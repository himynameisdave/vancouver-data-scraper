name: 🏗️ Building permits

permissions:
  contents: write

on:
  push:
  workflow_dispatch:
  schedule:
    # Run twice a day at 7am and 7pm Pacific Time
    # Offset to slightly off the hour, so that not all of these scrapers are running at the same time.
    - cron: '6 15 * * *'
    - cron: '6 3 * * *'

jobs:
  scheduled:
    runs-on: ubuntu-latest
    # This ensures that at most only one can be run at a time
    concurrency:
      group: scrape-vancouver-data
      cancel-in-progress: false
    steps:
    - name: Check out this repo
      uses: actions/checkout@v4

    - name: Fetch latest data
      shell: bash
      run: |-
        set -euo pipefail
        raw=$(mktemp)
        split=$(mktemp -d)
        curl -fsS --retry 3 --retry-all-errors -o "$raw" \
          "https://opendata.vancouver.ca/api/explore/v2.1/catalog/datasets/issued-building-permits/exports/json?lang=en&timezone=America%2FLos_Angeles"
        # Refuse to replace good data with an empty or non-array response, or with records that
        # don't have the four-digit issueyear their file is named after
        jq -e 'type == "array" and length > 0 and all(.[]; .issueyear | type == "string" and test("^[0-9]{4}$"))' "$raw" > /dev/null
        # Write one file per issue year, since a single file would exceed GitHub's 100 MB file size limit.
        # The whole directory is replaced so that a year which disappears upstream is removed here too.
        for year in $(jq -r '[.[].issueyear] | unique[]' "$raw"); do
          jq --arg year "$year" '[.[] | select(.issueyear == $year)] | sort_by(.permitnumber)' "$raw" > "$split/$year.json"
        done
        rm -rf ./data/building-permits
        mv "$split" ./data/building-permits

    # The full export is nondeterministic: on each refresh a few hundred older permits swap between
    # alternate issuedates (or drop out and come back). Filtering on permitnumbercreateddate, which is
    # stable, gives a feed whose added records are exactly the newly issued permits. See issue #4.
    # Bump the cutoff occasionally to keep this file small.
    - name: Fetch recent permits
      shell: bash
      run: |-
        set -euo pipefail
        raw=$(mktemp)
        sorted=$(mktemp)
        curl -fsS --retry 3 --retry-all-errors -o "$raw" \
          "https://opendata.vancouver.ca/api/explore/v2.1/catalog/datasets/issued-building-permits/exports/json?where=permitnumbercreateddate%20%3E%3D%20date'2025-01-01'&lang=en&timezone=America%2FLos_Angeles"
        jq 'sort_by(.permitnumber)' "$raw" > "$sorted"
        # Refuse to replace good data with an empty or non-array response
        jq -e 'type == "array" and length > 0' "$sorted" > /dev/null
        mv "$sorted" ./data/building-permits-recent.json

    - name: Commit and push if it changed
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        timestamp=$(date -u)
        git commit -m "🏗️ Latest building permits data: ${timestamp}" || exit 0
        git pull --rebase origin main
        git push
